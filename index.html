<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075FE8">
<title>Checklist Kiriman PRN</title>
<style>
:root{
  --navy:#071d3a;
  --blue:#075fe8;
  --blue2:#0a4fc6;
  --blue-soft:#edf4ff;
  --green:#159447;
  --green-soft:#e8f8ee;
  --orange:#ea9419;
  --orange-soft:#fff2dd;
  --ink:#12243d;
  --muted:#64748b;
  --line:#d7e1ec;
  --bg:#eef4fa;
  --card:#fff;
  --shadow:0 12px 30px rgba(18,36,61,.08);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 100% 0%,rgba(7,95,232,.10),transparent 28%),
    linear-gradient(180deg,#eef5fb 0%,#f7f9fc 55%,#eef3f8 100%);
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.header{
  position:sticky;top:0;z-index:30;color:#fff;
  background:linear-gradient(135deg,var(--navy) 0%,#103f85 56%,var(--blue) 100%);
  box-shadow:0 10px 26px rgba(7,29,58,.22);overflow:hidden
}
.header:after{
  content:"";position:absolute;right:-95px;top:-120px;width:330px;height:330px;border-radius:50%;
  background:rgba(255,255,255,.08)
}
.header-inner{max-width:760px;margin:auto;padding:15px 14px;position:relative;z-index:1}
.brand-row{display:flex;align-items:center;gap:11px}
.brand-icon{
  width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;flex:none
}
.brand-icon svg{width:23px;height:23px}
.brand-title{font-size:18px;font-weight:900;letter-spacing:-.45px}

.container{max-width:760px;margin:auto;padding:12px 12px 34px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.date-card{padding:10px;margin-bottom:9px}
.date-row{display:flex;align-items:center;gap:9px}
.date-label{font-size:10px;font-weight:900;color:#53647b}
.date-input{
  flex:1;height:42px;border:1px solid #cbd7e5;background:#fff;border-radius:12px;
  padding:0 11px;color:#12243d;outline:none;font-weight:750
}
.date-today{
  height:42px;padding:0 13px;border:1px solid #c7d8f5;background:#f5f9ff;
  color:#0a51c8;border-radius:12px;font-size:10px;font-weight:900
}

.tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px
}
.tab{
  border:1px solid var(--line);background:#fff;color:#506178;border-radius:14px;
  padding:10px 4px;font-size:10px;font-weight:900;box-shadow:0 2px 5px rgba(15,23,42,.03)
}
.tab.active{
  color:#fff;border-color:var(--blue);
  background:linear-gradient(135deg,#0753ca,#0a68ee);
  box-shadow:0 8px 18px rgba(7,95,232,.22)
}
.tab-count{display:block;font-size:8px;margin-top:2px;opacity:.82}

.search:focus,.date-input:focus{border-color:#7eb0ff;box-shadow:0 0 0 4px rgba(7,95,232,.08)}


.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.summary-card{padding:12px;overflow:hidden;position:relative}
.summary-card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px}
.summary-card.total:before{background:var(--blue)}
.summary-card.receive:before{background:var(--green)}
.summary-card.send:before{background:var(--orange)}
.summary-label{font-size:8px;font-weight:900;color:#64748b;letter-spacing:.04em}
.summary-num{font-size:22px;font-weight:900;margin-top:4px;letter-spacing:-.5px}

.section-bar{display:flex;justify-content:space-between;align-items:end;margin:2px 2px 8px}
.section-bar h2{font-size:15px;margin:0;font-weight:900}
.section-bar span{font-size:9px;color:var(--muted)}

.list{display:grid;gap:10px}
.empty{padding:34px 16px;text-align:center}
.empty-icon{
  width:46px;height:46px;border-radius:15px;margin:0 auto 10px;background:#edf2f7;color:#8090a5;
  display:grid;place-items:center
}
.empty-title{font-size:11px;font-weight:850;color:#4a5b72}
.empty-sub{font-size:9px;color:var(--muted);margin-top:3px}

.shipment{padding:12px}
.ship-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.branch-name{font-size:16px;font-weight:900;letter-spacing:-.2px}
.ship-code{font-size:10px;color:#60738c;margin-top:3px;font-weight:700}
.status{
  padding:7px 9px;border-radius:999px;font-size:8px;font-weight:900;white-space:nowrap
}
.status.wait{color:#a35e00;background:var(--orange-soft);border:1px solid #f0d29e}
.status.ready{color:#0b56cc;background:#edf4ff;border:1px solid #cce0ff}
.status.done{color:#117c3d;background:var(--green-soft);border:1px solid #bce4c9}

.quick{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px
}
.quick-item{
  display:flex;gap:7px;align-items:center;padding:8px 9px;border-radius:11px;
  background:#f8fafc;border:1px solid #e4eaf1
}
.q-dot{width:7px;height:7px;border-radius:50%;flex:none}
.q-dot.green{background:var(--green)}.q-dot.orange{background:#e59a1c}
.quick-item b{display:block;font-size:9px}.quick-item small{display:block;color:#8592a3;font-size:7px;margin-top:1px}

.section{
  margin-top:12px;padding-top:12px;border-top:1px solid #e8edf3
}
.section-head{display:flex;justify-content:space-between;gap:8px;align-items:end;margin-bottom:6px}
.section-title{font-size:9px;font-weight:900;color:#4f627b;letter-spacing:.03em}
.section-note{font-size:8px;color:#8390a1;margin-top:2px}

.photo{
  border:1px solid #ccd7e3;border-radius:14px;overflow:hidden;background:#eef3f8
}
.photo img{display:block;width:100%;height:190px;object-fit:cover;cursor:zoom-in}
.no-photo{
  height:105px;display:grid;place-items:center;text-align:center;padding:14px;
  color:#8290a2;font-size:9px;line-height:1.35;background:linear-gradient(135deg,#edf2f7,#f9fbfd)
}
.camera-btn{
  display:block;width:100%;margin-top:7px;padding:10px;text-align:center;border-radius:11px;
  background:linear-gradient(135deg,#075fe8,#0a4fbe);color:#fff;font-size:10px;font-weight:900;
  box-shadow:0 7px 16px rgba(7,95,232,.18)
}
.camera-btn.secondary{
  color:#0b57c7;background:#edf4ff;border:1px solid #cce0ff;box-shadow:none
}

.check-row{
  width:100%;display:flex;align-items:center;gap:9px;padding:11px;border-radius:13px;
  border:1px solid #d5deea;background:#fff
}
.check-row input{width:20px;height:20px;flex:none}
.check-row.receive input{accent-color:var(--green)}
.check-row.send input{accent-color:var(--blue)}
.check-row.receive.active{background:#eaf8ef;border-color:#b7e0c4}
.check-row.send.active{background:#edf4ff;border-color:#c5dcff}
.check-main b{display:block;font-size:11px}.check-main span{display:block;font-size:8px;color:#718198;margin-top:2px;line-height:1.35}
.check-state{margin-left:auto;font-size:20px;color:#a7b1be}.receive.active .check-state{color:var(--green)}.send.active .check-state{color:var(--blue)}

.fab{
  position:fixed;right:15px;bottom:16px;width:54px;height:54px;border:0;border-radius:17px;
  background:linear-gradient(145deg,#0a68ef,#064ab7);color:#fff;box-shadow:0 16px 30px rgba(7,80,190,.28);
  font-size:29px;z-index:25
}

.modal{
  position:fixed;inset:0;background:rgba(3,18,37,.52);display:none;align-items:flex-end;
  justify-content:center;padding:11px;z-index:60
}
.modal.show{display:flex}
.sheet{
  width:min(760px,100%);background:#fff;border-radius:22px;padding:16px;
  box-shadow:0 30px 80px rgba(3,18,37,.27)
}
.sheet h3{margin:0;font-size:17px}.sheet p{margin:4px 0 12px;font-size:9px;color:#6a7a8f;line-height:1.45}
.field{margin-top:9px}.field label{display:block;font-size:8px;font-weight:900;color:#65758a;margin-bottom:5px}
.field input,.field select{width:100%;height:42px}
.sheet-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}
.btn{padding:10px 13px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:10px;font-weight:900}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}

.viewer{
  position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;
  padding:18px;z-index:90
}
.viewer.show{display:flex}
.viewer img{max-width:100%;max-height:86vh;border-radius:11px;cursor:pointer;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.viewer-close{
  position:absolute;right:16px;bottom:22px;padding:10px 18px;border:0;border-radius:12px;
  background:rgba(255,255,255,.20);color:#fff;font-weight:900;
  border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px)
}
.toast{
  position:fixed;left:50%;bottom:18px;transform:translate(-50%,18px);opacity:0;
  background:#122033;color:#fff;padding:10px 13px;border-radius:11px;font-size:9px;z-index:100;
  transition:.2s;box-shadow:0 12px 26px rgba(0,0,0,.25);white-space:nowrap;max-width:90vw
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:650px){
  .container{padding-top:16px}
  .modal{align-items:center}
  .sheet{border-radius:22px}
  .fab{right:calc((100vw - 760px)/2 + 15px)}
}
@media(max-width:520px){
  .summary-card{padding:10px}.summary-num{font-size:20px}
  .quick{grid-template-columns:1fr}
  .photo img{height:175px}
  .brand-title{font-size:17px}
}

/* Header truck + premium iconography */
.truck-wrap{width:64px;height:42px;display:flex;align-items:center;overflow:visible;position:relative}
.truck-svg{width:86px;height:42px;overflow:visible;filter:drop-shadow(0 6px 9px rgba(0,0,0,.18))}
.truck-body{transform-origin:center;animation:truckCruise 2.5s ease-in-out infinite}
.speed-lines{animation:speedPulse 1.2s ease-in-out infinite}
@keyframes truckCruise{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@keyframes speedPulse{0%,100%{opacity:.45;transform:translateX(0)}50%{opacity:1;transform:translateX(-3px)}}
.chip-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#61d58a;margin-right:5px;box-shadow:0 0 0 3px rgba(97,213,138,.13)}
.summary-card{display:flex;align-items:center;gap:10px}
.summary-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.summary-icon svg{width:22px;height:22px}
.blue-icon{background:#e6f0ff;color:#075fe8}.green-icon{background:#e5f7ec;color:#159447}.orange-icon{background:#fff0d8;color:#d4800b}
.summary-label{font-weight:900}
.dispatch-strip .section-bar{margin:0 0 0 auto;flex:1}
.dispatch-strip .section-bar h2{font-size:13px}
.dispatch-strip .section-bar span{font-size:8px}
.brand-row{gap:9px}
@media(max-width:520px){
  .truck-wrap{width:52px}.truck-svg{width:73px}
  .brand-title{font-size:16px}
  .summary-icon{width:37px;height:37px;border-radius:12px}
  .summary-icon svg{width:20px;height:20px}
  .summary-card{gap:8px}
}


/* READABLE MOBILE TYPOGRAPHY */
body{font-size:14px}
.brand-title{font-size:19px;line-height:1.15}
.date-label{font-size:11px}
.date-input{font-size:16px;font-weight:800}
.date-today{font-size:11px}
.tab{font-size:11px;padding:11px 4px}
.tab-count{font-size:9px}
.summary-label{font-size:9px}
.summary-num{font-size:25px}
.section-bar h2{font-size:17px}
.section-bar span{font-size:10px}
.branch-name{font-size:19px}
.ship-code{font-size:11px}
.status{font-size:9px;padding:8px 10px}
.quick-item b{font-size:11px}
.quick-item small{font-size:8px}
.section-title{font-size:10px}
.section-note{font-size:9px}
.check-main b{font-size:13px}
.check-main span{font-size:10px}
.camera-btn{font-size:11px;padding:11px}
.no-photo{font-size:10px}
.result-count{font-size:10px}
@media(max-width:520px){
  .brand-title{font-size:17px}
  .summary-label{font-size:8.5px}
  .summary-num{font-size:23px}
  .section-bar h2{font-size:16px}
  .branch-name{font-size:18px}
  .check-main b{font-size:12px}
  .check-main span{font-size:9px}
}


/* INFORMATION HIERARCHY */
body{font-size:14px;color:var(--ink)}
.brand-title{font-size:20px;font-weight:950;letter-spacing:-.5px}
.date-label{font-size:10px;font-weight:900}
.date-input{font-size:16px;font-weight:850}
.date-today{font-size:10px;font-weight:900}

.tab{font-size:11px;font-weight:900}
.tab-count{font-size:9px;font-weight:800}

.summary-label{font-size:8px;font-weight:850;line-height:1.1}
.summary-num{font-size:26px;font-weight:950;line-height:1}
.section-bar h2{font-size:18px;font-weight:950}
.section-bar span{font-size:9px}

.branch-name{font-size:20px;font-weight:950;line-height:1.1}
.ship-code{font-size:11px;font-weight:700;color:#64748b}
.status{font-size:9px;font-weight:950}

.quick-item b{font-size:12px;font-weight:900}
.quick-item small{font-size:7px;font-weight:800;letter-spacing:.04em}

.section-title{font-size:11px;font-weight:950;letter-spacing:.04em}
.section-note{font-size:9px;font-weight:600}

.check-main b{font-size:14px;font-weight:950}
.check-main span{font-size:9px;font-weight:600;color:#65758a}
.check-state{font-size:21px}

.camera-btn{font-size:11px;font-weight:950}
.no-photo{font-size:10px;font-weight:650}

.empty-title{font-size:12px;font-weight:900}
.empty-sub{font-size:9px}

@media(max-width:520px){
  .brand-title{font-size:17px}
  .date-input{font-size:15px}
  .tab{font-size:10px}
  .summary-label{font-size:8px}
  .summary-num{font-size:24px}
  .section-bar h2{font-size:17px}
  .branch-name{font-size:19px}
  .ship-code{font-size:10px}
  .quick-item b{font-size:11px}
  .section-title{font-size:10px}
  .check-main b{font-size:13px}
  .check-main span{font-size:9px}
}


/* DIFFERENT COLOR HEADER PER SHIPMENT */
.shipment{overflow:hidden}
.shipment .ship-head{margin:-12px -12px 0;padding:12px 12px 11px;border-bottom:1px solid rgba(15,23,42,.07);border-radius:18px 18px 0 0}
.shipment.color-0 .ship-head{background:linear-gradient(135deg,#eaf3ff,#dbeafe);border-bottom-color:#bfdbfe}
.shipment.color-1 .ship-head{background:linear-gradient(135deg,#eefbf3,#dcfce7);border-bottom-color:#bbf7d0}
.shipment.color-2 .ship-head{background:linear-gradient(135deg,#f4efff,#ede9fe);border-bottom-color:#ddd6fe}
.shipment.color-3 .ship-head{background:linear-gradient(135deg,#fff8e8,#fef3c7);border-bottom-color:#fde68a}
.shipment.color-4 .ship-head{background:linear-gradient(135deg,#fff0f3,#ffe4e6);border-bottom-color:#fecdd3}
.shipment.color-0 .ship-chevron{background:#fff;color:#1764c0}
.shipment.color-1 .ship-chevron{background:#fff;color:#16804a}
.shipment.color-2 .ship-chevron{background:#fff;color:#7048b8}
.shipment.color-3 .ship-chevron{background:#fff;color:#a16207}
.shipment.color-4 .ship-chevron{background:#fff;color:#be3150}
.shipment.collapsed .ship-head{border-radius:18px}

.ship-head{cursor:pointer;user-select:none}
.ship-head:active{transform:scale(.995)}
.ship-chevron{
  width:28px;height:28px;border-radius:10px;background:#edf3fa;color:#52657d;
  display:grid;place-items:center;flex:none;transition:.2s
}
.ship-chevron svg{width:15px;height:15px;transition:.2s}
.shipment.collapsed .ship-chevron svg{transform:rotate(-90deg)}
.shipment.collapsed .shipment-details{display:none}
.shipment.collapsed{padding-bottom:12px}
.shipment.collapsed .quick{margin-bottom:0}
.shipment.collapsed .quick-item{padding:7px 9px}
.shipment.collapsed .quick-item b{font-size:10px}

</style>

<style id="header-right-fix">
.brand-row{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important}
.title-only{display:flex;align-items:center;min-width:0;flex:1}

}
</style>

<style id="shipment-distinction-final">
/* Each shipment stays white, but gets a clear blue identity marker. */
.shipment{position:relative;overflow:hidden;}

<script>
const STORAGE_KEY = "checklist_prn_modern_v1";

let data = [];
let selectedBranch = "";
// Simpan status buka/tutup card agar render() tidak otomatis me-minimize kembali.
const expandedShipments = new Set();
const deletingShipments = new Set();
const LOCAL_DELETED_KEY = "checklist_prn_deleted_ids_v1";
const LOCAL_PENDING_DELETE_KEY = "checklist_prn_pending_deletes_v1";
let deletedShipments = new Set();
let pendingDeletes = new Set();

try{
  const rawDeleted=JSON.parse(localStorage.getItem(LOCAL_DELETED_KEY)||"[]");
  if(Array.isArray(rawDeleted)) deletedShipments=new Set(rawDeleted);
}catch(e){}
try{
  const rawPending=JSON.parse(localStorage.getItem(LOCAL_PENDING_DELETE_KEY)||"[]");
  if(Array.isArray(rawPending)) pendingDeletes=new Set(rawPending);
}catch(e){}

function persistDeleteState(){
  localStorage.setItem(LOCAL_DELETED_KEY,JSON.stringify([...deletedShipments]));
  localStorage.setItem(LOCAL_PENDING_DELETE_KEY,JSON.stringify([...pendingDeletes]));
}

function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function formatDate(v){
  return new Date(v+"T00:00:00").toLocaleDateString("id-ID",{
    weekday:"long",day:"2-digit",month:"long",year:"numeric"
  });
}
function uid(){
  return `${Date.now()}_${Math.random().toString(36).slice(2,9)}`;
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

/* Intentionally starts from zero: no dummy records. */
const stored = localStorage.getItem(STORAGE_KEY);
if(stored){
  try{
    data = JSON.parse(stored);
    if(!Array.isArray(data)) data=[];
  }catch{data=[]}
}
data = data.map(x=>({
  id:x.id||uid(),
  date:x.date||todayKey(),
  branch:x.branch||"PBK",
  code:x.code||"",
  note:x.note||"",
  received:!!x.received,
  sent:!!x.sent,
  photoCabang:x.photoCabang||"",
  photoTerimaBjm:x.photoTerimaBjm||"",
  photoBjm:x.photoBjm||"",
  createdAt:Number(x.createdAt)||Date.now()
}));
save();

function dayData(){
  const date=document.getElementById("datePicker").value||todayKey();
  return data
    .filter(x=>x.date===date && !deletingShipments.has(x.id) && !deletedShipments.has(x.id))
    .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}

function visibleData(){
  return dayData().filter(x=>!selectedBranch||x.branch===selectedBranch);
}

function status(x){
  if(!x.received) return ["PERLU TERIMA","wait"];
  if(!x.sent) return ["SIAP DIKIRIM","ready"];
  return ["SELESAI","done"];
}

window.toggleShipment=function(id){
  const card=document.querySelector(`.shipment[data-id="${id}"]`);
  if(!card)return;
  const willExpand=card.classList.contains("collapsed");
  card.classList.toggle("collapsed",!willExpand);
  if(willExpand) expandedShipments.add(id);
  else expandedShipments.delete(id);
};

function render(){
  const day=dayData();
  const list=visibleData();

  document.getElementById("countPbk").textContent=day.filter(x=>x.branch==="PBK").length;
  document.getElementById("countTanjung").textContent=day.filter(x=>x.branch==="Tanjung").length;
  document.getElementById("countMtp").textContent=day.filter(x=>x.branch==="MTP").length;

  document.getElementById("sumTotal").textContent=day.length;
  document.getElementById("sumReceive").textContent=day.filter(x=>!x.received).length;
  document.getElementById("sumSend").textContent=day.filter(x=>!x.sent).length;

  document.querySelectorAll(".tab").forEach(b=>{
    b.classList.toggle("active", b.dataset.branch===selectedBranch);
  });

  document.getElementById("sectionTitle").textContent=selectedBranch||"Semua Kiriman";
  document.getElementById("resultCount").textContent=`${list.length} kiriman`;

  if(!list.length){
    document.getElementById("list").innerHTML=`
      <div class="empty card">
        <div class="empty-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z"/><path d="m3 7.5 9 4.5 9-4.5"/>
          </svg>
        </div>
        <div class="empty-title">Belum ada kiriman</div>
        <div class="empty-sub">Belum ada data pada ${esc(formatDate(document.getElementById("datePicker").value||todayKey()))}.</div>
      </div>`;
    return;
  }

  document.getElementById("list").innerHTML=list.map(x=>{
    const st=status(x);
    const colorClass=`color-${list.indexOf(x)%5}`;
    return `
      <article class="shipment card ${colorClass} ${expandedShipments.has(x.id)?"":"collapsed"}" data-id="${x.id}">
        <div class="ship-head" onclick="toggleShipment('${x.id}')">
          <div class="ship-identity">
            <span class="name-capsule">${esc(x.code || "Tanpa nama")}</span>
            ${x.note?`<div class="ship-code">${esc(x.note)}</div>`:""}
          </div>
          <div style="display:flex;align-items:center;gap:7px;position:relative">
            <span class="status ${st[1]}">${st[0]}</span>
            <button type="button" class="ship-more" aria-label="Menu kiriman"
                    onclick="event.preventDefault();event.stopPropagation();toggleShipmentMenu('${x.id}',this,event)">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>
              </svg>
            </button>
            <span class="ship-chevron" aria-label="Buka/tutup">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </span>
            <div class="shipment-menu" id="shipment-menu-${x.id}">

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxSide=1100;
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        let q=.70, out="";
        for(let i=0;i<6;i++){
          out=canvas.toDataURL("image/jpeg",q);
          if(out.length<=380000)break;
          q-=.07;
        }
        resolve(out);
      };
      img.onerror=reject;img.src=reader.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}

window.takePhoto=async function(event,id,type){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;

  try{
    toast("Memproses foto...");
    const photo=await compressImage(file);
    const x=data.find(a=>a.id===id);
    if(!x)return;

    const field=type==="cabang"?"photoCabang":(type==="terima"?"photoTerimaBjm":"photoBjm");
    const statusField=type==="cabang"?"photoCabangStatus":(type==="terima"?"photoTerimaBjmStatus":"photoBjmStatus");
    const onlineField=type==="cabang"?"photoCabangOnline":(type==="terima"?"photoTerimaBjmOnline":"photoBjmOnline");

    // Show preview immediately, then upload automatically.
    x[field]=photo;
    x[statusField]="uploading";
    x[onlineField]=false;
    save();
    render();

    try{
      if(typeof window.__firebaseUploadPhotoToRTDB!=="function"){
        throw new Error("Firebase upload belum siap");
      }

      await window.__firebaseUploadPhotoToRTDB(id,type,photo);

      x[statusField]="online";
      x[onlineField]=true;
      save();
      render();
      toast("✓ Foto tersimpan online");
    }catch(uploadErr){
      console.error("Auto upload foto:",uploadErr);
      x[statusField]="pending";
      x[onlineField]=false;
      save();
      render();
      toast("Foto tersimpan di HP, belum online");
    }
  }catch(e){
    console.error(e);
    toast("Foto gagal diproses");
  }
  event.target.value="";
};

window.uploadPhotoOnline=async function(evt,id,type){
  evt?.preventDefault?.();

  const x=data.find(a=>a.id===id);

    x[statusField]="online";

    save();

    toast("✓ Foto berhasil tersimpan online");

    console.error("Upload ulang foto:",err);
    x[statusField]="pending";
    x[onlineField]=false;
    save();
    render();
    toast("Upload foto gagal");
  }
};

<script>
let globalDeleteId=null;

window.toggleShipmentMenu=function(id,btn,evt){
  evt?.preventDefault?.();
  evt?.stopPropagation?.();

  const menu=document.getElementById('globalShipmentMenu');
  const del=document.getElementById('globalDeleteShipmentBtn');
  if(!menu || !del) return;

  document.querySelectorAll('.shipment-menu.open').forEach(m=>m.classList.remove('open'));
  globalDeleteId = id;
  del.dataset.deleteId = id;

  const r=btn.getBoundingClientRect();
  const menuWidth=Math.min(Math.max(del.scrollWidth+28,165),220);
  const menuHeight=52;
  const gap=8;
  const margin=8;

  let left=r.right-menuWidth;
  if(left<margin) left=margin;
  if(left+menuWidth>window.innerWidth-margin) left=window.innerWidth-menuWidth-margin;

  let top=r.bottom+gap;
  if(top+menuHeight>window.innerHeight-margin){
    top=Math.max(margin,r.top-menuHeight-gap);
  }

  menu.style.width=menuWidth+'px';
  menu.style.left=Math.round(left)+'px';
  menu.style.top=Math.round(top)+'px';

  // Direct handler: this button is outside the card DOM, so card rerenders
  // cannot interfere with the delete click.
  del.onclick=(e)=>{
    e.preventDefault();
    e.stopPropagation();
    globalDeleteShipment();
  };

  menu.classList.add('open');
  menu.setAttribute('aria-hidden','false');
};


async function performDeleteShipment(id){
  const x=data.find(a=>a.id===id);
  if(!x){
    toast("Kiriman tidak ditemukan");
    return;
  }

  const name=x.code || "kiriman ini";
  if(!window.confirm("Hapus "+name+"?\n\nData checklist dan foto kiriman ini akan dihapus.")){
    return;
  }

  // Remove from the current device immediately.
  deletedShipments.add(id);
  pendingDeletes.add(id);
  persistDeleteState();

  data=data.filter(a=>a.id!==id);
  expandedShipments.delete(id);
  save();
  render();
  closeGlobalShipmentMenu();

  try{
    if(typeof window.__firebaseDeleteItem==="function"){
      await window.__firebaseDeleteItem(id);
      pendingDeletes.delete(id);
      persistDeleteState();
      toast("Kiriman berhasil dihapus");
    }else{
      // Keep it deleted locally; the pending queue will retry when Firebase is ready.
      toast("Kiriman dihapus di HP");
    }
  }catch(err){
    console.error("Delete shipment error:",err);
    // Do NOT restore it. Pending delete remains queued for the next online retry.
    persistDeleteState();
    toast("Kiriman dihapus, menunggu sinkronisasi");
  }
}

window.deleteShipment=function(id){
  return performDeleteShipment(id);
};

async function globalDeleteShipment(){
  const id=globalDeleteId || document.getElementById('globalDeleteShipmentBtn')?.dataset.deleteId;
  if(!id) return;

  closeGlobalShipmentMenu();
  await performDeleteShipment(id);
}

function closeGlobalShipmentMenu(){
  const menu=document.getElementById('globalShipmentMenu');
  if(menu){
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden','true');
  }
  globalDeleteId=null;
  const del=document.getElementById('globalDeleteShipmentBtn');
  if(del) del.removeAttribute('data-delete-id');
}

document.addEventListener('click',(e)=>{
  const del=e.target.closest('#globalDeleteShipmentBtn');
  if(del){
    e.preventDefault();
    e.stopPropagation();
    globalDeleteShipment();
    return;
  }

  const more=e.target.closest('.ship-more');
  if(more) return; // opener handles its own event

  const menu=e.target.closest('#globalShipmentMenu');
  if(menu) return;

  closeGlobalShipmentMenu();
}, false);

window.addEventListener('scroll',closeGlobalShipmentMenu,{passive:true});
window.addEventListener('resize',closeGlobalShipmentMenu);
</script>

  function setOnlineUI(online,msg){

  function cleanItem(x){
    return {
      id:x.id||uid(), date:x.date||todayKey(), branch:x.branch||'PBK', code:x.code||'', note:x.note||'',
      received:!!x.received, sent:!!x.sent,

      photoCabangOnline:x.photoCabangOnline===true,
      photoTerimaBjmOnline:x.photoTerimaBjmOnline===true,
      photoBjmOnline:x.photoBjmOnline===true,
      createdAt:Number(x.createdAt)||Date.now()
    };
  }

  function remoteToArray(root){
    const raw=root?.items;
    let arr=[];
    if(Array.isArray(raw)) arr=raw.map(cleanItem);
    else if(raw && typeof raw==='object') arr=Object.values(raw).map(cleanItem);

    const remoteDeleted=root?.deleted;
    if(remoteDeleted && typeof remoteDeleted==='object'){
      Object.keys(remoteDeleted).forEach(id=>deletedShipments.add(id));
      persistDeleteState();
    }
    return arr.filter(x=>!deletedShipments.has(x.id));
  }

  async function patchItem(id,patch){
    if(!db) throw new Error('Firebase belum siap');
    await update(ref(db,ITEMS_PATH+'/'+id),patch);
    setOnlineUI(true,'Live Sync tersambung');
  }

  window.__firebasePatchItem=async function(id,patch){
    try{ await patchItem(id,patch); }
    catch(err){ console.error('Firebase checklist update:',err); setOnlineUI(false,'Gagal sinkron checklist'); }
  };

  window.__firebaseDeleteItem=async function(id){
    if(!db) throw new Error('Firebase belum siap');

    try{
      // Atomic root update:
      // 1) remove the actual item
      // 2) write a tombstone so every connected device hides the item
      //    even if another listener briefly has stale cached data.
      const patch={};
      patch[`items/${id}`]=null;
      patch[`deleted/${id}`]=Date.now();
      await update(ref(db,DB_PATH),patch);

      // Best-effort cleanup of the three possible Storage files.
      if(storage){
        for(const type of ['cabang','terima','bjm']){
          try{
            await deleteObject(storageRef(storage,`checklist_prn/${id}/${type}.jpg`));
          }catch(photoErr){
            console.debug('Storage delete skipped:', photoErr?.code || photoErr);
          }
        }
      }

      setOnlineUI(true,'Kiriman terhapus dari server');
    }catch(err){
      console.error('Firebase delete error:',err);
      setOnlineUI(false,'Menunggu sinkronisasi hapus');
      throw err;
    }
  };

  window.__firebaseUploadPhotoToRTDB=async function(id,type,dataUrl){
    if(!db) throw new Error('Firebase belum siap');
    const field=type==='cabang'?'photoCabang':(type==='terima'?'photoTerimaBjm':'photoBjm');
    const statusField=type==='cabang'?'photoCabangStatus':(type==='terima'?'photoTerimaBjmStatus':'photoBjmStatus');

    // Image is compressed before this call. Realtime Database is used here
    // so the upload does not depend on Firebase Storage authentication/rules.
    await update(ref(db,ITEMS_PATH+'/'+id),{
      [field]:dataUrl,
      [field+'UpdatedAt']:Date.now(),
      [statusField]:'online'
    });
  };

  window.__firebaseUploadPhotoAndPatch=async function(id,type,dataUrl){
    if(!db || !storage) throw new Error('Firebase belum siap');
    const field=type==='cabang'?'photoCabang':(type==='terima'?'photoTerimaBjm':'photoBjm');
    const storagePath=`checklist_prn/${id}/${type}.jpg`;
    const sref=storageRef(storage,storagePath);
    await uploadString(sref,dataUrl,'data_url',{contentType:'image/jpeg',cacheControl:'public,max-age=31536000'});
    const url=await getDownloadURL(sref);
    const local=data.find(x=>x.id===id);
    if(local){ local[field]=url; localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); render(); }
    await patchItem(id,{[field]:url});
    setOnlineUI(true,'Foto tersimpan online');
  };

  window.__firebaseSaveData=async function(nextData){
    if(!db || hydrating) return;
    try{
      const arr=Array.isArray(nextData)?nextData.map(cleanItem):[];
      for(const item of arr) await set(ref(db,ITEMS_PATH+'/'+item.id),item);
      setOnlineUI(true,'Live Sync tersambung');
    }catch(err){
      console.error('Firebase full sync:',err);
      setOnlineUI(false,'Gagal menyimpan ke Firebase');
    }
  };

  async function flushPendingDeletes(){
    if(!pendingDeletes.size || !window.__firebaseDeleteItem) return;
    const ids=[...pendingDeletes];
    for(const id of ids){
      try{
        await window.__firebaseDeleteItem(id);
        pendingDeletes.delete(id);
        deletedShipments.add(id);
        persistDeleteState();
      }catch(err){
        console.error('Pending delete retry failed:',err);
      }
    }
    render();
  }

  try{
    const app=getApps().length ? getApps()[0] : initializeApp(config);
    db=getDatabase(app); storage=getStorage(app);

    onValue(ref(db,'.info/connected'),snap=>{
      const online=!!snap.val();
      setOnlineUI(online,online?'Live Sync tersambung':'Menunggu koneksi');
      if(online) flushPendingDeletes();
    });

    onValue(ref(db,DB_PATH),async snapshot=>{
      const root=snapshot.val();
      const remote=remoteToArray(root);

      // One-time migration from the previous /items array format.
      if(Array.isArray(root?.items)){
        if(remote.length){
          for(const item of remote) await set(ref(db,ITEMS_PATH+'/'+item.id),item);
        }
        return;
      }

      hydrating=true;
      data=remote;
      localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
      hydrating=false;
      try{render();}catch(e){console.error(e)}
      setOnlineUI(true,'Data realtime tersinkron');
    });

    // Push existing local-only data once when the new structure is empty.
    setTimeout(async()=>{
      try{
        const local=Array.isArray(data)?data:[];
        const snap=await new Promise(resolve=>onValue(ref(db,ITEMS_PATH),resolve,{onlyOnce:true}));
        if(!snap.val() && local.length) await window.__firebaseSaveData(local);
      }catch(err){ console.error('Initial Firebase sync:',err); }
    },800);

    setTimeout(()=>flushPendingDeletes(),1600);
  }catch(err){
    console.error('Firebase init error:',err);
    setOnlineUI(false,'Mode lokal');
  }
})();
</script>



<script id="mcode-max12-guard">
(function(){
  const input=document.getElementById("mCode");
  if(!input) return;
  const sync=()=>{
    if(input.value.length>12) input.value=input.value.slice(0,12);
  };
  input.maxLength=12;
  input.addEventListener("input",sync);
  input.addEventListener("paste",()=>setTimeout(sync,0));
  sync();
})();
</script>
